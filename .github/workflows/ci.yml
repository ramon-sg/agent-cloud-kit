name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js --help
  test-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: npm ci
      - run: npm run build
      - run: bun --bun dist/cli.js --help
      - name: Pack and run the tarball with Bun and npx
        run: |
          tgz="$(npm pack --silent | tail -n1)"
          dir="$(mktemp -d)"
          cd "$dir"
          bun add "$GITHUB_WORKSPACE/$tgz"
          bun x --bun agent-cloud-kit --version
          npx --yes -p "$GITHUB_WORKSPACE/$tgz" agent-cloud-kit --version
